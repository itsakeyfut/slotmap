name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide detailed information to help us understand and fix the issue.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of the bug in 1-2 sentences.
      placeholder: SlotMap.get() returns a value for a stale key after the slot was reused by a later insert.
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: Current Behavior
      description: What is currently happening?
      placeholder: |
        After `remove(key)` and a subsequent `insert(...)` that reuses the same slot,
        calling `get(old_key)` returns the new value instead of `null`. The generation
        check does not appear to reject the stale key.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should happen instead?
      placeholder: |
        `get(old_key)` should return `null` because the slot's generation was bumped
        on removal, invalidating any key held from before the reuse.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal code or steps to reproduce the bug.
      placeholder: |
        ```zig
        var m = try SlotMap(u32).init(allocator);
        defer m.deinit();

        const k1 = try m.insert(10);
        _ = m.remove(k1);
        const k2 = try m.insert(20);   // reuses k1's slot
        _ = m.get(k1);                 // expected null, got 20
        ```

        Or run: `zig build test`
    validations:
      required: true

  - type: textarea
    id: error_output
    attributes:
      label: Error Output / Stack Trace
      description: Include any error messages, panics, or stack traces.
      placeholder: |
        thread 12345 panic: index out of bounds: index 8, len 8
        src/slotmap.zig:70:20: 0x... in contains (slotmap)
        src/slotmap.zig:75:9: 0x... in get (slotmap)
        ...
      render: shell

  - type: input
    id: version
    attributes:
      label: Version / Commit
      description: Which version or git commit of slotmap are you using?
      placeholder: "commit bcdf02a (or tag v0.1.0)"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide your environment information.
      placeholder: |
        - OS: Ubuntu 24.04 / macOS 15 / Windows 11
        - Zig: 0.16.0 (output of `zig version`)
        - Architecture: x86_64 / aarch64
        - Optimize mode: Debug / ReleaseSafe / ReleaseFast / ReleaseSmall
      render: markdown
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Any other context that might be helpful (minimal repro, related issues, workarounds).
      placeholder: |
        - Only reproducible after many inserts trigger a grow()
        - Workaround: checking contains() before get() avoids the crash
        - Related to issue #123

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have provided a minimal reproduction case
          required: true
        - label: I have tested on the latest commit
          required: false
