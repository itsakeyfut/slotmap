name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide enough information to help us evaluate and prioritize it.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of the feature in 1-2 sentences.
      placeholder: Add a `clear()` method to reset the SlotMap while retaining allocated capacity.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? Who benefits from it?
      placeholder: |
        I reuse a single SlotMap across frames in a game loop and want to drop all
        entities each frame without reallocating. Today I have to deinit() and init()
        again, which frees and re-allocates the backing storage every time.

        Target user: game / simulation developers using SlotMap for entity storage
    validations:
      required: true

  - type: textarea
    id: detailed_description
    attributes:
      label: Detailed Description
      description: Describe the desired behavior, API shape, and any edge cases to consider.
      placeholder: |
        A `clear` method that empties the map but keeps `slots` allocated:
        - Resets `live`, `next_fresh`, and `free_head`
        - Bumps every slot's generation so previously handed-out keys stay invalid
        - Leaves capacity untouched so subsequent inserts avoid a grow()

        ```zig
        var m = try SlotMap(u32).init(allocator);
        const k = try m.insert(10);
        m.clear();
        // m.count() == 0, m.get(k) == null, capacity preserved
        ```
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches have you tried or considered?
      placeholder: |
        - deinit() + init(): works but frees and re-allocates the backing storage
        - Removing every key individually: O(n) and requires tracking all live keys

  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to prior art, related issues, or design notes.
      placeholder: |
        - Rust slotmap crate `clear`: https://docs.rs/slotmap/latest/slotmap/
        - Related issue: #45

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would improve my workflow
        - High - Blocking my use case
      default: 0
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement this feature
          required: false
        - label: I can provide test cases
          required: false
        - label: I can help with documentation
          required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: This feature aligns with the project's goals (a small, safe, generational SlotMap for Zig)
          required: false
